set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# wezterm 20240203 blanks part of the neighbouring pane when scroll-up (CSI S) runs under
# DECSLRM left/right margins. tmux enables margins by itself once the terminal answers as
# VT420+, and only uses them for side-by-side panes, so splitting to the right (Alt-\) wiped
# the right half of the old pane's text until it was redrawn. Without margins tmux redraws
# the region instead. Takes effect when a client attaches.
set -as terminal-features "xterm*:margins@"
set -gq allow-passthrough on
set -g focus-events on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000

# Closing a session switches to another one instead of leaving tmux.
set -g detach-on-destroy off

set -g prefix C-a

set -g mouse on

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
# bind | split-window -h -c "#{pane_current_path}" "exec $SHELL" \; resize-pane -D 30
# bind | split-window -h -c "#{pane_current_path}" "exec $SHELL" \;
# M-\ is ESC \, which is also the ST terminator of terminal replies. yazi probes the outer
# terminal through passthrough and the replies come back as keystrokes, so an unguarded
# binding splits a pane per reply. Inside yazi, forward the key instead of splitting.
bind -n M-\\ if-shell -F '#{==:#{pane_current_command},yazi}' 'send-keys M-\\' 'split-window -h -c "#{pane_current_path}" "exec $SHELL"'

unbind '"'
# bind - split-window -v -c "#{pane_current_path}" "exec $SHELL" \; resize-pane -D 10
# bind - split-window -v -c "#{pane_current_path}" "exec $SHELL" \;
bind -n M-- split-window -v -c "#{pane_current_path}" "exec $SHELL"

# Prefix pane navigation is intentionally left to Alt-h/j/k/l below.
# Ctrl-\ toggles to the last session (e.g. config <-> dev), native & instant.
# (kanata only overrides Ctrl+h/j/k/l, so Ctrl+\ passes through to tmux.)
bind -n C-\\ switch-client -l
bind Tab last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# No-prefix window navigation: Alt-, (<) prev, Alt-. (>) next
bind -n M-, previous-window
bind -n M-. next-window

# No-prefix session navigation: same keys + Shift. Cycles in session_id
# (creation) order -- switch-client -p/-n is hardcoded to *name* order, so the
# helper resolves the neighbour itself. Ctrl-\ still toggles just the last one.
bind -n M-< run-shell "~/.config/tmux/scripts/session-cycle.sh prev '#{client_tty}' '#{session_id}'"
bind -n M-> run-shell "~/.config/tmux/scripts/session-cycle.sh next '#{client_tty}' '#{session_id}'"

bind m resize-pane -Z

# lazygit floating popup
bind g display-popup -E -w 90% -h 90% "lazygit"
# sesh built-in picker (tmux sessions + zoxide dirs): prefix + T
bind T display-popup -h 90% -w 50% -E "sesh picker -i"
# prefix+o: same list as SessionX (tmux sessions only, current one hidden) but via sesh,
# which opens in ~70ms vs ~280ms for SessionX's bash/fzf-tmux chain.
bind o display-popup -h 90% -w 50% -E "sesh picker -t -H"
# yazi floating popup in the current pane's directory: prefix + C-y
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
# config editor menu: prefix + F  (z .zshrc, a aliases, t tmux.conf, v nvim, w wezterm.lua)
bind F display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"       z "display-popup -w 85% -h 85% -E 'nvim ~/.zshrc'" \
    "aliases.zsh"  a "display-popup -w 85% -h 85% -E 'nvim ~/.config/zsh/aliases.zsh'" \
    "tmux.conf"    t "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.conf'" \
    "nvim config"  v "display-popup -w 95% -h 95% -E 'cd ~/.config/nvim && nvim init.lua'" \
    "wezterm.lua"  w "display-popup -w 85% -h 85% -E 'nvim ~/.config/wezterm/wezterm.lua'"
# Toggle floating scratch popup: Alt-t opens it, Alt-t inside hides it (state persists).
# (Alt-p is left free for the AeroSpace workspace key.)
# Popup attaches a persistent "scratch" session; the hook hides that session's status bar
# and keeps detach-on-destroy on for it, so exiting its shell closes the popup instead of
# switching the popup client to another session.
bind -n M-t if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"'
set-hook -g session-created 'if-shell -F "#{==:#{session_name},scratch}" "set-option -t scratch status off ; set-option -t scratch detach-on-destroy on"'
# Toggle synchronize-panes (type to all panes at once)
bind e setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

bind-key "(" copy-mode
# No M-[ : ESC [ opens every CSI reply (DA1, cell-size), which would enter copy-mode.
bind-key -n M-v copy-mode

unbind t
bind-key t command-prompt "new-session -s '%%'"

# unbind x
# bind-key x if-shell "[[ \$(tmux list-panes | wc -l) -gt 1 ]]" \
#     "kill-pane" \
#     "send-keys 'exit' C-m"


set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Y' send -X copy-selection
bind-key -T copy-mode-vi 'q' send -X cancel

unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
# Disabled: kanata remaps Ctrl+hjkl to arrow keys, so this plugin's C-hjkl
# bindings never reach tmux. Alt+hjkl bindings above + nvim-side vim-tmux-navigator
# (M-hjkl mappings) handle seamless pane/split navigation instead.
# set -g @plugin "christoomey/vim-tmux-navigator"

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
# prefix+o is sesh (below); SessionX stays reachable on its default prefix+O.
set -g @sessionx-bind 'O'

set -g @plugin 'wfxr/tmux-fzf-url' # prefix u -> fzf-pick a URL from the pane and open it
set -g @fzf-url-fzf-options '-w 60% -h 50% --multi --exit-0 --no-preview'

set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
# The Alt-p popup's scratch session is throwaway: keep it out of saves, or every restart
# brings it back among the real sessions.
set -g @resurrect-hook-post-save-layout '$HOME/.config/tmux/scripts/resurrect-drop-scratch.sh'



# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "


# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
# setw -g pane-border-status top
# setw -g pane-border-format ""
# setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
# setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
# setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
# pane_current_command is unreliable for TUI apps that rewrite their process title:
# Claude Code reports its version string ("2.1.231") or intermittently just "zsh".
# tmux-resurrect saves whatever the name was, so auto-named windows came back as
# "zsh"/"2.1.231". The cwd basename is always meaningful and never flaps.
set -g automatic-rename-format "#{s|$USER|~|:#{b:pane_current_path}}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last

# Overrides that must win over plugin defaults, so they live after tpm.
# catppuccin sets message-style with `align=centre` + `bg=default`, which draws the
# command prompt (prefix + , / : / ...) centred *on top of* the window list instead of
# taking over the status line. Left-align it and use `fill=` so the whole status line
# is cleared while a prompt or message is showing.
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_bg},fill=#{@thm_bg},align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_bg},fill=#{@thm_bg},align=left"
# catppuccin paints popups with an explicit bg=#1e1e2e, which wezterm renders fully opaque.
# bg=default lets popups inherit the terminal's window_background_opacity / blur instead.
set -gF popup-style "bg=default,fg=#{@thm_fg}"
